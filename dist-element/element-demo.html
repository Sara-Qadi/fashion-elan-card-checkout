<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;elan-cart-app&gt; — element smoke test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; font-family: Roboto, sans-serif; }
      .bar {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        padding: 12px 16px; background: #211a1d; color: #fff; font-size: 14px;
      }
      .bar button {
        font: inherit; padding: 6px 12px; border-radius: 999px; border: 0;
        background: #7b1e3a; color: #fff; cursor: pointer;
      }
      .bar code { background: #3a2f33; padding: 2px 6px; border-radius: 4px; }
      #log {
        max-height: 160px; overflow: auto; padding: 8px 16px; margin: 0;
        background: #f4efec; font: 12px/1.6 monospace; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone proof that the element works the way the shell needs it to:
      driven only by the `route` property, reporting navigation back as events.
      Deployed alongside the app so teammates can verify without cloning.
    -->
    <div class="bar">
      <strong>&lt;elan-cart-app&gt;</strong>
      <span>drive it:</span>
      <button data-route="/cart">/cart</button>
      <button data-route="/checkout/shipping">/checkout/shipping</button>
      <button data-route="/checkout/payment">/checkout/payment</button>
      <button data-route="/checkout/review">/checkout/review</button>
      <span>current: <code id="current">/cart</code></span>
    </div>

    <pre id="log">events will appear here…</pre>

    <elan-cart-app route="/cart"></elan-cart-app>

    <script type="module" src="./elan-cart-app.js"></script>
    <script type="module">
      const el = document.querySelector('elan-cart-app')
      const log = document.getElementById('log')
      const current = document.getElementById('current')
      let lines = []

      function write(name, detail) {
        lines = [`${name} ${JSON.stringify(detail)}`, ...lines].slice(0, 40)
        log.textContent = lines.join('\n')
      }

      for (const button of document.querySelectorAll('.bar button')) {
        button.addEventListener('click', () => {
          el.route = button.dataset.route
          current.textContent = button.dataset.route
        })
      }

      for (const name of [
        'elan:navigate',
        'elan:cart-updated',
        'elan:checkout-started',
        'elan:order-completed',
        'elan:navigate-catalog',
      ]) {
        window.addEventListener(name, (event) => {
          if (name === 'elan:navigate') current.textContent = event.detail.path
          write(name, event.detail)
        })
      }
    </script>
  </body>
</html>
